[package]
name = "cpython"
version = "3.12.3"
nanvix-version = "0.24.6"

[builds]
[builds.matrix]
platforms = ["microvm"]
modes = ["standalone"]
memory = ["256mb"]

[dependencies]
zlib = "1.3.1"
sqlite = "3.49.0"
openssl = "3.5.0"
bzip2 = "1.0.8"
libffi = "3.4.6"
libxml2 = "2.12.9"
libxslt = "1.1.42"
lxml = "5.3.0"
xz = "5.2.5"

[toolchain]
kind = "nanvix-sdk"
provider = "c-clang"
sdk-version = "v0.24.6-sdk.1"
sdk-image = "ghcr.io/nanvix/nanvix-sdk-c-clang"
sdk-digest = "sha256:b4eef6be72a0417ec009e0e35c803e8c66472f304dc963e908991601e01f2a79"
