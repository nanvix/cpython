libxslt = "1.1.42"
lxml = "5.3.0"
xz = "5.2.5"

[toolchain]
kind = "nanvix-sdk"
provider = "c-clang"
sdk-version = "v0.24.14-sdk.1"
sdk-image = "ghcr.io/nanvix/nanvix-sdk-c-clang"
sdk-digest = "sha256:de321f89dcc8fe746f63dc63f25a55c9c4c1ba30e328f0a44744017e56f62154"
