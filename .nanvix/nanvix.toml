[package]
name = "cpython"
version = "3.12.3"
nanvix-version = "0.23.16"

[builds]
[builds.matrix]
platforms = ["microvm"]
modes = ["standalone"]
memory = ["256mb"]

[dependencies]
zlib = "1.3.1"
sqlite = "3.49.0"
openssl = "3.5.0"
bzip2 = "1.0.8"
libffi = "3.4.6"
libxml2 = "2.12.9"
libxslt = "1.1.42"
lxml = "5.3.0"
xz = "5.2.5"

[toolchain]
kind = "nanvix-sdk"
provider = "c-clang"
sdk-version = "v0.23.16-sdk.1"
sdk-image = "ghcr.io/nanvix/nanvix-sdk-c-clang"
sdk-digest = "sha256:686a6067b9552d0992df2079f1ff8972dc77fa5d33f6d81ce901cc41ea288144"
